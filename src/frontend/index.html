<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNS Resolver Recommender</title>
    <script>
      // Apply the saved/preferred theme before paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('dnsrr-theme');
          var theme =
            stored === 'dnsrrlight' || stored === 'dnsrrdark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dnsrrdark'
                : 'dnsrrlight';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dnsrrlight');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
