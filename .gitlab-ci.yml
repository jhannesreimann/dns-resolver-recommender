stages:
  - deploy

deploy-frontend:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - deploy-vm
  script:
    - echo $USER
    - cd src/frontend
    # 1. Build the static bundle. The Rust->WASM engine is vendored into
    #    src/frontend/src/wasm, so no Rust toolchain is needed on the runner.
    - echo $(which npm)
    - echo $(which node)
    - npm ci
    - npm run build
    # 2. Copy the resulting frontend files to the nginx directory
    - rm -rf /data/www/*
    - cp -r ./dist/* /data/www/

deploy-backend:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  tags:
    - deploy-vm
  script:
    - /usr/bin/systemctl stop dohbench.service
    - cd src/backend
    - rm -rf /deploy/*
    - cp * /deploy/
    - uv sync
    - /usr/bin/systemctl start dohbench.service
