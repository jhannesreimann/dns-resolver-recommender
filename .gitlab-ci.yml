stages:
  - deploy

variables:
  VM_HOST: "46.225.184.21"
  VM_USER: "jhannesreimann"

# Base configuration for SSH agent setup
.ssh_setup: &ssh_setup
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy-frontend:
  stage: deploy
  <<: *ssh_setup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/frontend/**/*
        - src/wasm/**/*
  script:
    # 1. We don't have rust/wasm-pack easily on the GitLab runner, so we copy the files
    # to /tmp/ on the VM first, exactly like the manual deploy.
    - scp -r src/frontend src/wasm/pkg $VM_USER@$VM_HOST:/tmp/
    # 2. Run the copy commands on the VM using passwordless sudo
    - ssh $VM_USER@$VM_HOST "sudo cp -r /tmp/frontend/* /var/www/dnsrr/ && sudo cp -r /tmp/pkg/* /var/www/dnsrr/wasm/pkg/ && sudo chown -R www-data:www-data /var/www/dnsrr"

deploy-backend:
  stage: deploy
  <<: *ssh_setup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/backend/**/*
  script:
    # 1. Copy backend python files to /tmp/dnsrr/ on the VM
    - ssh $VM_USER@$VM_HOST "mkdir -p /tmp/dnsrr"
    - scp -r src/backend/dnsrr/* $VM_USER@$VM_HOST:/tmp/dnsrr/
    # 2. Copy to the actual FastAPI backend path and restart the daemon via passwordless sudo
    - ssh $VM_USER@$VM_HOST "sudo cp -r /tmp/dnsrr/* /opt/dnsrr/src/backend/dnsrr/ && sudo chown -R dnsrr:dnsrr /opt/dnsrr/src/backend && sudo systemctl restart dnsrr"
