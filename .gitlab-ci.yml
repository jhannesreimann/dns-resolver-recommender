stages:
  - deploy

variables:
  VM_HOST: "46.225.184.21"
  VM_USER: "jhannesreimann"

# Base configuration for SSH agent setup
.ssh_setup: &ssh_setup
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

deploy-frontend:
  stage: deploy
  # Node image so we can build the Vite app. It is Debian-based, so the shared
  # ssh_setup (which apt-get installs openssh-client) works unchanged.
  image: node:22-bookworm
  <<: *ssh_setup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/frontend/**/*
  script:
    # 1. Build the static bundle. The Rust->WASM engine is vendored into
    #    src/frontend/src/wasm, so no Rust toolchain is needed on the runner.
    - cd src/frontend
    - npm ci
    - npm run build
    - cd ../..
    # 2. Upload the build to a temp dir on the VM.
    - ssh $VM_USER@$VM_HOST "rm -rf /tmp/dnsrr-dist && mkdir -p /tmp/dnsrr-dist"
    - scp -r src/frontend/dist/. $VM_USER@$VM_HOST:/tmp/dnsrr-dist/
    # 3. Atomically replace the webroot contents via passwordless sudo. The build
    #    is fully self-contained (hashed assets + bundled wasm), so the old
    #    webroot (including the legacy wasm/pkg dir) is wiped first.
    - ssh $VM_USER@$VM_HOST "sudo find /var/www/dnsrr -mindepth 1 -delete && sudo cp -r /tmp/dnsrr-dist/. /var/www/dnsrr/ && sudo chown -R www-data:www-data /var/www/dnsrr"

deploy-backend:
  stage: deploy
  <<: *ssh_setup
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/backend/**/*
  script:
    # 1. Copy backend python files to /tmp/dnsrr/ on the VM
    - ssh $VM_USER@$VM_HOST "mkdir -p /tmp/dnsrr"
    - scp -r src/backend/dnsrr/* $VM_USER@$VM_HOST:/tmp/dnsrr/
    # 2. Copy to the actual FastAPI backend path and restart the daemon via passwordless sudo
    - ssh $VM_USER@$VM_HOST "sudo cp -r /tmp/dnsrr/* /opt/dnsrr/src/backend/dnsrr/ && sudo chown -R dnsrr:dnsrr /opt/dnsrr/src/backend && sudo systemctl restart dnsrr"
