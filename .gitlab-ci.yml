stages:
  - deploy

deploy-frontend:
  stage: deploy
  # Node image so we can build the Vite app. It is Debian-based, so the shared
  # ssh_setup (which apt-get installs openssh-client) works unchanged.
  image: node:22-bookworm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/frontend/**/*
  script:
    - cd src/frontend
    # 1. Build the static bundle. The Rust->WASM engine is vendored into
    #    src/frontend/src/wasm, so no Rust toolchain is needed on the runner.
    - npm ci
    - npm run build
    # 2. Copy the resulting frontend files to the nginx directory
    - rm -rf /data/www/*
    - cp -r ./dist/* /data/www/

deploy-backend:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - src/backend/**/*
  script:
    - cd src/deploy
    - sudo systemctl stop dohbench
    - rm -rf /deploy/*
    - cp -r * /deploy
    - sudo syttemctl start dohbench
